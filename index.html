<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logoth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--frame);font-family:Inter,system-ui,sans-serif;color:var(--ink);letter-spacing:-.01em;padding:12px;-webkit-font-smoothing:antialiased;overflow:hidden}

:root{
  --frame:#e3e3e1;
  --bg:#efefee;
  --ink:#161616;
  --ink-soft:rgba(22,22,22,.62);
  --line:rgba(22,22,22,.085);
  --card:#f7f7f6;
  --out:cubic-bezier(.16,1,.3,1);
}

.hero{
  position:relative;
  height:100%;
  border-radius:28px;
  overflow:hidden;
  background:var(--bg);
  container-type:size;
  isolation:isolate;
  touch-action:none;
  --log-w:max(163.45cqw,118cqh);
  --log-x:43.62cqw;
  --log-y:49cqh;
  --log-rot:-16.6deg;
  --tx:0px;
  --ty:0px;
  --r:clamp(150px,23.2cqw,460px);
  --mx:-9999px;
  --my:-9999px;
  --ox:0px;
  --oy:0px;
  --or:0px;
  --oi:0px;
}

/* Animations initial state */
.a{opacity:0}

/* Grid lines */
.grid{position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);transform-origin:top;opacity:0}
.grid i:nth-child(1){left:25%}
.grid i:nth-child(2){left:50%}
.grid i:nth-child(3){left:75%}

.is-playing .grid i{animation:line-in 1.8s var(--out) both}
.is-playing .grid i:nth-child(1){animation-delay:.05s}
.is-playing .grid i:nth-child(2){animation-delay:.18s}
.is-playing .grid i:nth-child(3){animation-delay:.31s}

@keyframes line-in{
  from{opacity:0;transform:scaleY(0)}
  to{opacity:1;transform:scaleY(1)}
}

/* Nav */
.nav{position:absolute;inset:0 0 auto 0;height:70px;font-size:max(.74rem,.92cqw);z-index:20}
.nav > *{position:absolute;top:50%;translate:0 -50%}

.brand{left:2.2cqw;display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--ink);padding:0}
.brand span{font-family:'Playfair Display',serif;font-style:italic;font-size:1.35em;letter-spacing:-.02em}

.link{color:var(--ink-soft);text-decoration:none;transform:translateX(-50%);transition:color .2s}
.link:nth-of-type(1){left:13.4%}
.link:nth-of-type(2){left:25%;color:var(--ink);font-weight:500}
.link:nth-of-type(3){left:37%}
.link:hover{color:var(--ink)}

.join{right:6.2cqw;font-weight:500;color:#fff;background:var(--ink);padding:.62em 1.35em;border-radius:999px;text-decoration:none;transition:background .2s}
.join:hover{background:#333}

.burger{right:2.2cqw;width:26px;height:12px;background:none;border:none;cursor:pointer;position:relative}
.burger::before,.burger::after{content:'';position:absolute;left:0;right:0;height:1.5px;background:var(--ink)}
.burger::before{top:2px}
.burger::after{bottom:2px}

.is-playing .nav .a{animation:drop .9s var(--out) both}
.is-playing .brand.a{animation-delay:.1s}
.is-playing .link.a:nth-of-type(1){animation-delay:.22s}
.is-playing .link.a:nth-of-type(2){animation-delay:.3s}
.is-playing .link.a:nth-of-type(3){animation-delay:.38s}
.is-playing .join.a{animation-delay:.3s}
.is-playing .burger.a{animation-delay:.38s}

@keyframes drop{
  from{opacity:0;margin-top:-12px}
  to{opacity:1;margin-top:0}
}

/* Headline */
.h1{position:absolute;left:2cqw;top:14cqh;font-size:max(2.3rem,4.5cqw);line-height:1.04;font-weight:400;z-index:10;white-space:nowrap}
.h1 .row{display:block;white-space:nowrap}
.h1 .row:first-child{font-family:'Playfair Display',serif;font-style:italic;letter-spacing:-.045em}
.h1 .row:last-child{font-family:Inter,system-ui,sans-serif;letter-spacing:-.07em}

.ch{display:inline-block;opacity:0}
.is-playing .ch{animation:ch-in 1.1s var(--out) calc(.28s + var(--i) * .034s) both}

@keyframes ch-in{
  from{opacity:0;transform:translateY(.38em);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}

/* Copy + CTA */
.copy{position:absolute;left:31cqw;top:14.6cqh;width:18cqw;z-index:10}
.lede{font-size:max(.72rem,.95cqw);line-height:1.55;color:var(--ink-soft)}
.is-playing .lede.a{animation:rise 1.1s var(--out) .95s both}

@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.cta{margin-top:2cqw;display:inline-flex;align-items:center;gap:12px;padding:.8cqw 1.7cqw .8cqw 1.1cqw;border-radius:999px;border:1px solid rgba(22,22,22,.22);font-size:max(.72rem,.95cqw);font-weight:500;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s, border-color .2s}
.cta:hover{background:#fff;border-color:rgba(22,22,22,.4)}
.cta span{opacity:0}
.is-playing .cta{animation:cta-in 1.2s var(--out) 1.15s both}
.is-playing .cta span{animation:fade .8s ease-out 1.55s both}

@keyframes cta-in{
  0%{clip-path:inset(0 100% 0 0 round 999px);opacity:0}
  10%{opacity:1}
  100%{clip-path:inset(0 0 0 0 round 999px);opacity:1}
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

/* The Log */
.log-stage{position:absolute;inset:0;z-index:2;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at var(--ox) var(--oy),#000 var(--oi),transparent var(--or)),linear-gradient(90deg,transparent var(--ox),#000 calc(var(--ox) + 1px));
  mask-image:radial-gradient(circle at var(--ox) var(--oy),#000 var(--oi),transparent var(--or)),linear-gradient(90deg,transparent var(--ox),#000 calc(var(--ox) + 1px));
}
.log-stage.done{-webkit-mask-image:none;mask-image:none}
.layer{position:absolute;inset:0}
.log{position:absolute;left:var(--log-x);top:var(--log-y);width:var(--log-w);aspect-ratio:2752/700;
  transform:translate3d(var(--tx),var(--ty),0) translate(-50%,-50%) rotate(var(--log-rot));transform-origin:50% 50%;will-change:transform}
.log img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

.reveal{
  -webkit-mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0,#000 40%,rgba(0,0,0,.75) 60%,rgba(0,0,0,.4) 75%,rgba(0,0,0,.12) 88%,transparent 100%);
  mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0,#000 40%,rgba(0,0,0,.75) 60%,rgba(0,0,0,.4) 75%,rgba(0,0,0,.12) 88%,transparent 100%);
}

/* Play Button */
.play{position:absolute;left:13cqw;top:55cqh;translate:-50% -50%;width:8.6cqw;height:8.6cqw;min-width:76px;min-height:76px;display:grid;place-items:center;background:none;border:none;cursor:pointer;z-index:10}
.play .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.play .dot{width:5.1cqw;height:5.1cqw;min-width:56px;min-height:56px;border-radius:50%;background:#fff;box-shadow:0 14px 30px -12px rgba(30,20,10,.55);display:grid;place-items:center;transition:transform .35s var(--out)}
.play:hover .dot{transform:scale(1.07)}

.is-playing .play .dot{animation:dot-pop 1.1s var(--out) 1.25s both}
.is-playing .play .ring{animation:ring-in 1.4s var(--out) 1.4s both}
.is-playing .play svg{animation:fade .6s ease-out 1.75s both}

@keyframes dot-pop{
  from{opacity:0;transform:scale(.2)}
  to{opacity:1;transform:scale(1)}
}

@keyframes ring-in{
  from{opacity:0;transform:scale(.55)}
  to{opacity:1;transform:scale(1)}
}

/* Stats */
.stat{position:absolute;display:flex;align-items:center;gap:.9cqw;font-size:max(.68rem,.8cqw);line-height:1.35;padding:.6cqw 1.3cqw .6cqw .8cqw;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
.stat svg{width:2.1cqw;min-width:24px;height:2.1cqw;min-height:24px;animation:spin 18s linear infinite}
.stat small{display:block;color:var(--ink-soft)}
.stat b{display:block;font-weight:500}

.stat1{left:56.2cqw;top:14cqh}
.stat2{left:56.2cqw;top:20.8cqh}

.is-playing .stat1{animation:rise 1.1s var(--out) 1.45s both}
.is-playing .stat2{animation:rise 1.1s var(--out) 1.6s both}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* Cards */
.card{position:absolute;overflow:hidden;background:var(--card);border-radius:2cqw;box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -28px rgba(30,30,25,.35);z-index:12;transition:translate .5s var(--out);cursor:pointer}
.card:hover{translate:0 -5px}

.card1{left:56.6cqw;top:31cqh;width:20.2cqw;height:32.5cqh}
.card2{left:76.9cqw;top:63.3cqh;width:20.2cqw;height:31cqh}

.is-playing .card1{animation:card-in 1.4s var(--out) .85s both}
.is-playing .card2{animation:card-in 1.4s var(--out) 1.02s both}

@keyframes card-in{
  0%{opacity:0;clip-path:inset(47% 14% 47% 14% round 999px)}
  10%{opacity:1}
  100%{opacity:1;clip-path:inset(0 0 0 0 round 2cqw)}
}

.card img, .card .in{opacity:0}
.is-playing .card img, .is-playing .card .in{animation:fade .9s ease-out 1.5s both}

.card img{position:absolute;width:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.card1 img{top:0;height:62%;object-position:50% 40%;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.card2 img{bottom:0;height:62%;object-position:50% 60%;-webkit-mask-image:linear-gradient(to top,#000 62%,transparent);mask-image:linear-gradient(to top,#000 62%,transparent)}

.card .tag{position:absolute;font-size:max(.62rem,.72rem);color:var(--ink-soft)}
.card1 .tag{left:8%;bottom:33%}
.card2 .tag{left:8%;top:10%}

.card .title{position:absolute;font-weight:500}
.card1 .title{left:8%;right:22%;bottom:8%;font-size:max(1rem,1.55cqw);line-height:1.12;letter-spacing:-.04em}
.card2 .title{left:8%;top:18%;font-size:max(1rem,1.55cqw);line-height:1.12;letter-spacing:-.04em}

.card-btn{position:absolute;right:7%;bottom:7%;width:3cqw;min-width:34px;height:3cqw;min-height:34px;border-radius:50%;background:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.35);display:grid;place-items:center;border:none;cursor:pointer;transition:transform .2s}
.card-btn:hover{transform:scale(1.1)}
.card2 .card-btn{bottom:auto;top:7%}

/* Scroll Cue */
.scroll{position:absolute;left:50%;bottom:0;z-index:10;pointer-events:none}
.scroll-word{position:absolute;left:-18px;bottom:7cqh;writing-mode:vertical-rl;font-size:.56rem;letter-spacing:.34em;color:#fff;mix-blend-mode:difference;opacity:0}
.scroll-line{position:absolute;left:-.5px;bottom:0;width:1px;height:6cqh;background:var(--ink);transform-origin:bottom;transform:scaleY(0)}

.is-playing .scroll-word{animation:fade 1s ease-out 2s both}
.is-playing .scroll-line{animation:line-in 1.2s var(--out) 2s both}

/* Responsive */
@media(max-width:760px){
  body{padding:8px}
  .hero{border-radius:22px;--log-y:58cqh}
  .link,.join,.stat,.scroll,.burger{display:none!important}
  .brand{left:18px}
  .nav{font-size:.8rem}
  .h1{left:20px;top:15%;font-size:2.7rem}
  .copy{left:20px;top:28.5%;width:62%}
  .lede{font-size:.8rem}
  .cta{margin-top:18px;padding:10px 20px 10px 14px;font-size:.8rem}
  .play{left:22%;top:60%;min-width:68px;min-height:68px;width:68px;height:68px}
  .play .dot{min-width:48px;min-height:48px;width:48px;height:48px}
  .card{border-radius:20px;top:auto;bottom:14px;width:calc(50% - 20px);height:21%}
  .card1{left:14px}
  .card2{right:14px;left:auto}
  .card1 .title,.card2 .title{font-size:.95rem}
  .card1 .tag,.card2 .tag{font-size:.62rem}
  .card-btn{width:30px;height:30px;min-width:30px;min-height:30px}
  .is-playing .card1{animation:card-in-mob 1.4s var(--out) .85s both}
  .is-playing .card2{animation:card-in-mob 1.4s var(--out) 1.02s both}
}

@keyframes card-in-mob{
  0%{opacity:0;clip-path:inset(47% 14% 47% 14% round 999px)}
  10%{opacity:1}
  100%{opacity:1;clip-path:inset(0 0 0 0 round 20px)}
}

@media (prefers-reduced-motion:reduce){
  .a,.ch,.grid i,.nav .a,.lede.a,.cta,.cta span,.play .dot,.play .ring,.play svg,.stat1,.stat2,.card1,.card2,.scroll-word,.scroll-line{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important}
  .stat svg{animation:none!important}
}
</style>
</head>
<body>

</main>

<script>
// Split headline characters
const h1 = document.querySelector('.h1');
const rows = h1.querySelectorAll('.row');
let charIndex = 0;
rows.forEach(row => {
  const text = row.textContent;
  row.textContent = '';
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === ' ') {
      row.appendChild(document.createTextNode(' '));
    } else {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = char;
      span.style.setProperty('--i', charIndex++);
      row.appendChild(span);
    }
  }
});

// Motion Constants
const AXIS = -16.6 * Math.PI / 180;
const AX = Math.cos(AXIS);
const AY = Math.sin(AXIS);
const SLAB_MS = 300;
const SLAB = 0.5;
const GROW_MS = 700;
const CY = 0.50;
const RK = 0.56;
const EDGE_PX = 1.5;
const DRIFT = 0.205;
const DRIFT_MS = 25000;
const REV_LERP = 0.10;

const hero = document.getElementById('hero');
const stage = document.getElementById('stage');

let W = hero.clientWidth;
let H = hero.clientHeight;
let BR = RK * H;
let D1 = SLAB * W;
let D2 = (1 - SLAB) * W + BR;
let V2 = 2.2 * D2 / GROW_MS;

function measure() {
  W = hero.clientWidth;
  H = hero.clientHeight;
  BR = RK * H;
  D1 = SLAB * W;
  D2 = (1 - SLAB) * W + BR;
  V2 = 2.2 * D2 / GROW_MS;
  stage.style.setProperty('--oy', (CY * H) + 'px');
  stage.style.setProperty('--or', BR + 'px');
  stage.style.setProperty('--oi', Math.max(0, BR - EDGE_PX) + 'px');
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function easeOut(t, p) {
  return 1 - Math.pow(1 - t, p);
}

const varCache = {};
function setVar(name, val) {
  if (varCache[name] !== val) {
    varCache[name] = val;
    stage.style.setProperty(name, val);
  }
}

let t0 = 0;
let animating = false;
let doneAt = 0;
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function travel(t) {
  if (t <= SLAB_MS) {
    let a = 2 * D1 / SLAB_MS - V2;
    let b = (V2 * SLAB_MS - D1) / (SLAB_MS * SLAB_MS);
    return a * t + b * t * t;
  } else {
    let p = clamp((t - SLAB_MS) / GROW_MS, 0, 1);
    return D1 + D2 * easeOut(p, 2.2);
  }
}

// Cursor and Touch tracking
const mouse = { x: -9999, y: -9999 };
const target = { x: -9999, y: -9999 };
let hasPointerMoved = false;

window.addEventListener('pointermove', e => {
  if (!hasPointerMoved) {
    hasPointerMoved = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  }
  target.x = e.clientX;
  target.y = e.clientY;
}, { passive: true });

const isTouch = window.matchMedia('(hover: none)').matches;

function frame(now) {
  if (!animating) return;
  const dt = now - t0;

  if (prefersReduced) {
    setVar('--ox', '-9999px');
    setVar('--tx', '0px');
    setVar('--ty', '0px');
    stage.classList.add('done');
  } else {
    if (dt < SLAB_MS + GROW_MS) {
      let trav = travel(dt);
      let cx = W - trav + BR;
      setVar('--ox', cx + 'px');

      let ps = easeOut(clamp(dt / SLAB_MS, 0, 1), 3);
      let slide = (1 - ps) * (SLAB / AX);
      let dist = slide * W;
      setVar('--tx', (dist * AX) + 'px');
      setVar('--ty', (dist * AY) + 'px');
    } else {
      if (!doneAt) {
        doneAt = dt;
        stage.classList.add('done');
      }
      let postDt = dt - doneAt;
      let drift = Math.sin(clamp(postDt / DRIFT_MS, 0, 1) * Math.PI / 2) * DRIFT;
      let dist = -drift * W;
      setVar('--tx', (dist * AX) + 'px');
      setVar('--ty', (dist * AY) + 'px');
      setVar('--ox', '-9999px');
    }
  }

  // Touch fallback or mouse lerp
  if (isTouch && !hasPointerMoved && dt > (SLAB_MS + GROW_MS + 600)) {
    let simT = (dt - (SLAB_MS + GROW_MS + 600));
    let x = W * (0.5 + 0.30 * Math.sin(simT / 1500));
    let y = H * 0.49 + (x - W * 0.4362) * Math.tan(AXIS);
    target.x = x;
    target.y = y;
  }

  if (target.x !== -9999) {
    if (mouse.x === -9999) {
      mouse.x = target.x;
      mouse.y = target.y;
    } else {
      mouse.x += (target.x - mouse.x) * REV_LERP;
      mouse.y += (target.y - mouse.y) * REV_LERP;
    }
    setVar('--mx', mouse.x + 'px');
    setVar('--my', mouse.y + 'px');
  }

  requestAnimationFrame(frame);
}

function play() {
  hero.classList.remove('is-playing');
  void hero.offsetWidth; // force reflow
  hero.classList.add('is-playing');

  measure();
  stage.classList.remove('done');
  doneAt = 0;
  t0 = performance.now();

  let initialSlide = (SLAB / AX) * W;
  setVar('--tx', (initialSlide * AX) + 'px');
  setVar('--ty', (initialSlide * AY) + 'px');
  setVar('--ox', W + BR + 'px');

  animating = true;
  requestAnimationFrame(frame);
}

document.getElementById('replay').addEventListener('click', play);
document.getElementById('play').addEventListener('click', play);

window.addEventListener('resize', () => {
  measure();
});

// Initialization: wait for images decode and fonts ready (max 900ms for fonts)
async function init() {
  const imgs = document.querySelectorAll('img');
  const decodePromises = Array.from(imgs).map(img => img.decode().catch(() => {}));
  
  const fontPromise = document.fonts.ready;
  const timeoutPromise = new Promise(resolve => setTimeout(resolve, 900));

  await Promise.all([
    Promise.all(decodePromises),
    Promise.race([fontPromise, timeoutPromise])
  ]);

  play();
}

init();
</script>
